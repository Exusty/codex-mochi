name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build release app
        run: ./scripts/build_app.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: CodexMochi-app
          path: dist/CodexMochi.app
